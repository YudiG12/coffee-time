name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
permissions: { contents: read, issues: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sed -i "s/REPLACE_WITH_YOUR_D1_ID/${{ secrets.D1_DATABASE_ID }}/" wrangler.jsonc
      # Creates queues/buckets that wrangler.jsonc names but don't exist yet (a new binding can't break the deploy).
      - run: node scripts/provision.mjs
      - run: npm run db:migrate
      # The browser PUTs straight to signed R2 URLs (ADR 0002): without this rule the preflight fails and no upload works.
      - run: npx wrangler r2 bucket cors set coffee-time-media --file r2-cors.json --force
      - id: deploy
        run: |
          npm run deploy 2>&1 | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      # Smoke test on production: the bindings the app needs really work (local verify simulates them).
      - name: Production health
        run: |
          url="${{ steps.deploy.outputs.url }}"
          [ -n "$url" ] || { echo "no workers.dev URL in the deploy output"; exit 1; }
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "$url/api/health?deep=1") && { echo "$body"; exit 0; }
            sleep 6
          done
          echo "health failed: $(curl -sS "$url/api/health?deep=1")"; exit 1
      # A failed deploy becomes work for the builder (label deploy-failed, taken before the queue) and blocks auto-merge.
      - name: Open a deploy-failed issue
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --label deploy-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Deploy failed again at ${GITHUB_SHA::7}: $run"; exit 0; fi
          gh issue create --label agent --label deploy-failed --title "Fix the failing production deploy" --body "$(printf '%s\n' \
            '## What' "The deploy of \`main\` at ${GITHUB_SHA::7} failed: $run" \
            'Read the failed step log (`gh run view --log-failed`), fix the cause in the repo (config, provisioning, code) and make the deploy green.' \
            'Auto-merge is blocked for every other PR until a deploy of `main` succeeds.' \
            '## Done when…' '- [ ] the deploy workflow on main is green, including "Production health"' \
            '- [ ] the cause is covered (provision step, verify check or AGENTS.md rule) so it cannot happen again' \
            '## Out of scope' 'Unrelated features.')"
