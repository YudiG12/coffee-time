"1013.0" y="237" text-anchor="middle" class="s" style="fill:#fff">one job per submission</text><path d="M150,190 L150,102 L460,102" class="a" style="stroke:#8E6FCB;stroke-width:2.2" marker-end="url(#m-sweep)"/><rect x="177.1" y="91.0" width="224.8" height="22" rx="11" fill="#8E6FCB"/><text x="289.5" y="106.0" text-anchor="middle" class="p">1. find stuck · 3. set status</text><path d="M150,254 L150,342 L460,342" class="a" style="stroke:#8E6FCB;stroke-width:2.2" marker-end="url(#m-sweep)"/><rect x="230.8" y="331.0" width="210.4" height="22" rx="11" fill="#8E6FCB"/><text x="336.0" y="346.0" text-anchor="middle" class="p">2. complete? move or delete</text><path d="M260,222 L880,222" class="a" style="stroke:#E08A3C;stroke-width:2.2" marker-end="url(#m-bg)"/><rect x="535.6" y="211.0" width="217.6" height="22" rx="11" fill="#E08A3C"/><text x="644.4" y="226.0" text-anchor="middle" class="p">4. transcribe the valid ones</text>
